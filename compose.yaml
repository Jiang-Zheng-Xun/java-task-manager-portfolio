services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-task_manager}"
      POSTGRES_USER: "${DB_USERNAME:-task_manager}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-task_manager} -d ${DB_NAME:-task_manager}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
