name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: task_manager
          POSTGRES_USER: task_manager
          POSTGRES_PASSWORD: ci-only-password-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_manager -d task_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/task_manager
      DB_USERNAME: task_manager
      DB_PASSWORD: ci-only-password-not-a-secret
      SERVER_ADDRESS: 127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify
        run: mvn --batch-mode --no-transfer-progress clean verify
